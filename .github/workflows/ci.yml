name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CC: gcc
  CXX: g++

jobs:
  release:
    name: Release build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  asan-ubsan:
    name: Debug build, ASan + UBSan
    runs-on: ubuntu-latest
    env:
      # UBSan only prints by default; make undefined behaviour fail the test
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  tsan:
    name: Debug build, TSan on queue tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TSan cannot start under the address-space randomisation of recent kernels.
      # The emulator wrapper runs every test binary, including CMake's test discovery
      # at build time, with randomisation disabled.
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread"
          "-DCMAKE_CROSSCOMPILING_EMULATOR=setarch;x86_64;-R"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure -R "^SpscQueue\."
