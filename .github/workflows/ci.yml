name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CC: gcc
  CXX: g++

# Pinned, not ubuntu-latest: a new Ubuntu brings a new GCC whose new warnings would fail -Werror.
jobs:
  release:
    name: Release build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      # Exits non-zero if the threaded pipeline disagrees with a single-threaded replay
      - name: End-to-end pipeline
        run: ./build/matching_engine 1000000
      # Standard library only: analyse.py imports matplotlib just for charts
      - name: Generate flow
        run: python3 tools/generate_flow.py build/flow.csv --messages 100000
      - name: Replay flow through the engine
        run: python3 tools/replay.py build/flow.csv --engine build/matching_engine
      # Fails if the trades break a consistency check or differ from the reference matcher
      - name: Analyse trades
        run: python3 tools/analyse.py build/flow.csv build/flow.trades.csv --no-chart

  asan-ubsan:
    name: Debug build, ASan + UBSan
    runs-on: ubuntu-24.04
    env:
      # UBSan only prints by default; make undefined behaviour fail the test
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  tsan:
    name: Debug build, TSan on queue tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # TSan cannot start under the address-space randomisation of recent kernels.
      # The emulator wrapper runs every test binary, including CMake's test discovery
      # at build time, with randomisation disabled.
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread"
          "-DCMAKE_CROSSCOMPILING_EMULATOR=setarch;x86_64;-R"
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure -R "^SpscQueue\."
      # Small count: this is a Debug build, so the invariant checker walks the whole book
      # after every message. A race makes TSan exit with 66 and fails the step.
      - name: End-to-end pipeline under TSan
        run: setarch x86_64 -R ./build/matching_engine 5000
